name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update
      - run: moon version
      - run: moon fmt --check
      - name: Check and test all targets
        shell: bash
        run: |
          for target in native js wasm-gc; do
            moon check --deny-warn --target "$target"
            moon test --deny-warn --target "$target"
          done
      - run: python3 scripts/cli-smoke.py
      - run: moon package
